# Robot terminal application settings — sample.
#
# Same file and variable names as the T430 rootfs, so a terminal provisioned by
# robot-scada-client keeps working unchanged. The setup script installs this
# only when /etc/formfactor/app.conf is missing; existing device settings are
# never overwritten.
#
# (C) 2017-2026, Radical Electronic Systems - www.radicalsystems.co.za

# Local web UI — the [Home] button.
SERVER_CONFIG_URL=http://127.0.0.1

# Remote transaction page — the [Remote] button. Normally supplied by the
# server as SERVER_TRANSACTION_URL in /etc/formfactor/server.conf; this is the
# fallback used until the terminal is provisioned.
#SERVER_TRANSACTION_URL=

# Which app the kiosk session launches: BROWSER | CHROME | ROBOT-APP | DESKTOP
START_APP=BROWSER

API_PROTOCOL=ROBOT-API
APP_ENGINE=TERMINAL
